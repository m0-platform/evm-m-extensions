# Disabled on the Seismic branch: stock forge cannot compile shielded types
# (suint256) and this branch never merges to main. CI runs test-seismic.yml
# instead; a manual dispatch of this workflow will fail at compile.
name: Forge Coverage

on:
  workflow_dispatch:

permissions: write-all

jobs:
  check:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install lcov
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Run Forge build
        run: forge build
        id: build

      - name: Run coverage
        env:
          MNEMONIC: ${{ secrets.MNEMONIC_FOR_TESTS }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: make coverage profile=ci
        id: coverage

      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: lcov.info
          artifact-name: code-coverage-report
          minimum-coverage: 95
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
