name: Attest historical M0 nonce 22

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAINNET_RPC_URL: https://eth.drpc.org

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: crossecute/forge-attest@27727236af75dda63698d86ef3984b5206309634
        with:
          config: attest-nonce22.toml
          foundry-version: v1.8.1
          require-live: "true"
